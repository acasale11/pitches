<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitches</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitches">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8EDF0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E8EDF0;
    --card: #FBFCFD;
    --ink: #14213D;
    --muted: #5B6778;
    --rule: #C9D2DA;
    --add: #1F6F5C;
    --add-ink: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Public Sans', system-ui, sans-serif; font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    background: var(--paper); border-bottom: 1px solid var(--rule);
    padding: calc(14px + env(safe-area-inset-top)) 18px 14px; display: flex; justify-content: space-between; align-items: baseline;
  }
  header .tools { display: flex; gap: 16px; }
  .settings { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 18px; }
  .settings h2 { margin: 0 0 6px; font-size: 17px; }
  .settings p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; font-size: 14px; }
  .settings label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  .settings input { width: 100%; font: inherit; font-size: 15px; padding: 10px; border: 1px solid var(--rule); border-radius: 4px; }
  .settings .save { margin-top: 16px; width: 100%; background: var(--add); color: #fff; border: 0; border-radius: 4px; padding: 12px; font: inherit; font-weight: 600; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header button {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px;
    padding: 6px 0; cursor: pointer;
  }
  main { padding: 16px 14px calc(60px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }

  .card {
    background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
    padding: 18px 18px 14px; margin-bottom: 14px;
    transition: opacity .25s ease, transform .25s ease, max-height .3s ease, margin .3s ease, padding .3s ease;
  }
  .card.gone { overflow: hidden; opacity: 0; transform: translateX(24px); max-height: 0; margin: 0; padding-top: 0; padding-bottom: 0; border-width: 0; }
  .card.added { transform: translateX(-24px); }

  .ticker {
    font-weight: 800; font-size: 34px; letter-spacing: -0.02em; line-height: 1; margin: 0;
  }
  .company { margin: 6px 0 0; font-size: 15px; font-weight: 600; }
  .facts { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .simple {
    font-family: 'Newsreader', Georgia, serif; font-size: 20px; line-height: 1.5;
    margin: 14px 0 10px; max-width: 34em;
  }
  .bm { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 0 0 12px; max-width: 38em; }
  .exposure { font-size: 14px; line-height: 1.55; margin: 0 0 12px; padding-left: 10px; border-left: 3px solid var(--add); max-width: 38em; }
  .bm.solo { font-family: 'Newsreader', Georgia, serif; font-size: 19px; color: var(--ink); margin-top: 14px; }
  .pitch { display: block; color: var(--ink); font-size: 14px; line-height: 1.4; padding: 10px 0; border-top: 1px solid var(--rule); }
  .pitch span { color: var(--muted); display: block; font-size: 12px; margin-top: 2px; }

  .note { display: none; width: 100%; margin: 4px 0 10px; font: inherit; font-size: 15px;
    border: 1px solid var(--rule); border-radius: 4px; padding: 10px; min-height: 70px; resize: vertical; }
  .note.open { display: block; }

  .actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  .actions button { font: inherit; font-size: 15px; font-weight: 600; border-radius: 4px; padding: 12px 14px; cursor: pointer; }
  .skip { background: none; border: 1px solid var(--rule); color: var(--muted); }
  .addnote { background: none; border: 0; color: var(--muted); font-weight: 400 !important; padding-left: 4px !important; }
  .add { margin-left: auto; background: var(--add); color: var(--add-ink); border: 0; min-width: 140px; }
  .actions button:disabled { opacity: .5; }
  button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--add); outline-offset: 2px; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.6; }
  .empty strong { color: var(--ink); display: block; font-size: 17px; margin-bottom: 6px; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 4px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .card, .toast { transition: none; } }
</style>
</head>
<body>
<header>
  <h1 id="count">Loading</h1>
  <div class="tools">
    <button id="refresh" type="button">Refresh</button>
    <button id="gear" type="button">Settings</button>
  </div>
</header>
<main id="list"></main>
<div class="toast" id="toast" role="status"></div>

<script>
  const list = document.getElementById('list');
  const countEl = document.getElementById('count');
  let remaining = 0;

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function setCount() {
    countEl.textContent = remaining === 1 ? '1 company to review' : remaining + ' companies to review';
  }
  function showEmpty() {
    list.innerHTML = '<div class="empty"><strong>Inbox clear</strong>Import this week\'s scrape into the Scrape tab, then run Tracker, Process scrape on your computer.</div>';
  }

  function render(cards) {
    remaining = cards.length; setCount();
    if (!cards.length) return showEmpty();
    list.innerHTML = cards.map(c => {
      const facts = [c.industry, c.geo].filter(Boolean).join(', ');
      const pitchMeta = [c.date, c.count > 1 ? c.count + ' pitches' : ''].filter(Boolean).join(', ');
      return `
      <article class="card" data-t="${esc(c.ticker)}">
        <p class="ticker">${esc(c.ticker)}</p>
        <p class="company">${esc(c.company)}</p>
        ${facts ? `<p class="facts">${esc(facts)}</p>` : ''}
        ${c.simple ? `<p class="simple">${esc(c.simple)}</p>` : ''}
        <p class="bm${c.simple ? '' : ' solo'}">${esc(c.bm)}</p>
        ${c.exposure ? `<p class="exposure">${esc(c.exposure)}</p>` : ''}
        ${c.link ? `<a class="pitch" href="${esc(c.link)}">Read the pitch<span>${esc(c.title)}${pitchMeta ? '<br>' + esc(pitchMeta) : ''}</span></a>` : ''}
        <textarea class="note" placeholder="Notes for your tracker (optional)"></textarea>
        <div class="actions">
          <button type="button" class="skip">Skip</button>
          <button type="button" class="addnote">Add note</button>
          <button type="button" class="add">Add to tracker</button>
        </div>
      </article>`;
    }).join('');
  }

  function removeCard(card, cls) {
    // Pin the card's real height first so it can shrink smoothly, however long it is
    card.style.maxHeight = card.scrollHeight + 'px';
    card.offsetHeight; // apply before animating
    card.classList.add(cls, 'gone');
    card.style.maxHeight = '0px';
    setTimeout(() => card.remove(), 320);
    remaining--; setCount();
    if (remaining === 0) setTimeout(showEmpty, 340);
  }

  list.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    const t = card.dataset.t;
    const btns = card.querySelectorAll('.actions button');

    if (e.target.classList.contains('addnote')) {
      const n = card.querySelector('.note');
      n.classList.toggle('open');
      if (n.classList.contains('open')) n.focus();
      return;
    }
    if (e.target.classList.contains('add')) {
      btns.forEach(b => b.disabled = true);
      const note = card.querySelector('.note').value.trim();
      api({ action: 'add', ticker: t, note })
        .then(() => { removeCard(card, 'added'); toast(t + ' added to tracker'); })
        .catch(err => { btns.forEach(b => b.disabled = false); toast('Could not add ' + t + ': ' + err.message); });
    }
    if (e.target.classList.contains('skip')) {
      btns.forEach(b => b.disabled = true);
      api({ action: 'skip', ticker: t })
        .then(() => removeCard(card, 'skipped'))
        .catch(err => { btns.forEach(b => b.disabled = false); toast('Could not skip ' + t + ': ' + err.message); });
    }
  });

  // ---- connection to your Google Sheet
  const cfg = () => ({ url: localStorage.getItem('scriptUrl') || '', token: localStorage.getItem('appToken') || '' });

  async function api(payload) {
    const { url, token } = cfg();
    const res = await fetch(url, { method: 'POST', body: JSON.stringify(Object.assign({ token }, payload)) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  function showSettings(msg) {
    const { url, token } = cfg();
    countEl.textContent = 'Settings';
    list.innerHTML = `
      <form class="settings" onsubmit="return false">
        <h2>Connect to your tracker</h2>
        <p>${esc(msg || 'Paste your web app link (ends in /exec) and your app password. You only need to do this once.')}</p>
        <label for="u">Web app link</label>
        <input id="u" type="url" autocomplete="off" value="${esc(url)}" placeholder="https://script.google.com/macros/s/.../exec">
        <label for="k">App password</label>
        <input id="k" type="text" autocomplete="off" autocapitalize="off" value="${esc(token)}">
        <button class="save" type="button" id="save">Save and load cards</button>
      </form>`;
    document.getElementById('save').addEventListener('click', () => {
      localStorage.setItem('scriptUrl', document.getElementById('u').value.trim());
      localStorage.setItem('appToken', document.getElementById('k').value.trim());
      load();
    });
  }

  function load() {
    const { url, token } = cfg();
    if (!url || !token) return showSettings();
    countEl.textContent = 'Loading';
    api({ action: 'cards' })
      .then(d => render(d.cards))
      .catch(err => showSettings('Could not connect: ' + err.message));
  }

  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('gear').addEventListener('click', () => showSettings());
  // reload when you come back to the app
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && cfg().url) load(); });
  load();
</script>
</body>
</html>
